name: Release

on:
  push:
    tags:
      - 'paintnode-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-preflight:
    name: managed Linux runtime targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        run: npm run verify:release-config

      - name: Verify published Linux provider targets
        run: |
          node scripts/verify-managed-runtime-manifest.mjs \
            https://github.com/Emilio-01-T/paintnode/releases/download/provider-runtimes-latest/runtime-manifest.json \
            linux x64

  release-linux:
    name: Linux x86_64
    needs: runtime-preflight
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: release_notes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Missing release notes: $NOTES_FILE" >&2
            echo "Create this file before tagging the release. It becomes the GitHub release body and updater notes." >&2
            exit 1
          fi
          {
            echo "body<<__PAINTNODE_RELEASE_NOTES__"
            cat "$NOTES_FILE"
            echo "__PAINTNODE_RELEASE_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload Linux release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAINTNODE_SIGN_LINUX_DEB: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: paintnode-v__VERSION__
          releaseName: PaintNode for Linux v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          retryAttempts: 3
          tauriScript: node scripts/tauri-release.mjs
          args: --bundles deb,appimage

  publish-release:
    name: Validate and publish Linux release
    needs: release-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate Linux updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="paintnode-v${VERSION}"
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/release-check"
          node scripts/verify-updater-json.mjs \
            "$RUNNER_TEMP/release-check/latest.json" \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb

      - name: Publish complete Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release edit "paintnode-v${VERSION}" --draft=false --latest
